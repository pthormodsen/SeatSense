server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed files here; they can be cached forever.
    # Missing assets must 404 instead of falling back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the entry point so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routes (/building/..., /room/...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
