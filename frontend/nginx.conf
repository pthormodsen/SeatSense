server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed files here; they can be cached forever.
    # Missing assets must 404 instead of falling back to index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the entry point so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Docker's embedded DNS. Resolving the backend per request (via the
    # variable below) lets nginx start, and serve the site, even when the
    # backend container is down; /api then returns 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Live sensor stream (Server-Sent Events): no buffering, long-lived.
    location ~ ^/api/sensors/[^/]+/stream$ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # Sensor uploads and read-only API. Request bodies are tiny.
    location /api/ {
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # SPA fallback for client-side routes (/building/..., /room/...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
