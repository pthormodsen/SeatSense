
[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
; The board JSON sets ARDUINO_USB_MODE=1 (USB-Serial/JTAG peripheral, not
; TinyUSB) but not CDC_ON_BOOT, so `Serial` would be UART0 (GPIO43/44, the
; CH343 USB-UART port). CDC_ON_BOOT=1 maps `Serial` to HWCDC on the native
; USB-C port (303A:1001); UART0 stays available as `Serial0`.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
