# SeatSense live sensor backend for k3s (namespace `apps`).
#
# Single replica on purpose: the latest state and the newest events are held
# in memory and the event log is one file, so two replicas would disagree.
# `Recreate` makes sure the old pod has released the volume first.
#
# The Secret is NOT in git. Create it once:
#   kubectl -n apps create secret generic seatsense-backend \
#     --from-literal=DEVICE_TOKENS="seat-001:$(openssl rand -hex 24)"
#
# The frontend pods reach the backend at
#   http://seatsense-backend.apps.svc.cluster.local:3001
# (set as SEATSENSE_BACKEND_URL on the seatsense Deployment).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seatsense-backend-data
  namespace: apps
spec:
  # k3s default storage class (local-path): the volume lives on one node and
  # the backend pod is scheduled there.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatsense-backend
  namespace: apps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: seatsense-backend}
  template:
    metadata:
      labels: {app: seatsense-backend}
    spec:
      # Node's SIGTERM handler closes live (SSE) streams and flushes the event
      # log; it exits within ~1-5 s.
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000   # `node` user in the image
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/pthormodsen/seatsense-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: DEVICE_TOKENS
              valueFrom:
                secretKeyRef: {name: seatsense-backend, key: DEVICE_TOKENS}
            - name: EVENTS_FILE
              value: /data/events.jsonl
            - name: OFFLINE_AFTER_MS
              value: "30000"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /api/health, port: 3001}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3001}
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {memory: 192Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seatsense-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: seatsense-backend
  namespace: apps
spec:
  # Default (Cluster) traffic policy, NOT Local like the frontend Service: there
  # is one backend pod, and the frontend pods on every node must reach it.
  selector: {app: seatsense-backend}
  ports:
    - port: 3001
      targetPort: 3001
